<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - Inspiration Da Vinci Psy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FFEB00 0%, #FC0019 20%, #01FF4F 40%, #FF01D7 60%, #5600CC 80%, #00EDF5 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Playfair Display', serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-align: center;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: glow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 2;
        }
        
        @keyframes glow {
            from { text-shadow: 2px 2px 10px #FFEB00, 0 0 20px #FFEB00; }
            to { text-shadow: 2px 2px 20px #00EDF5, 0 0 30px #00EDF5; }
        }
        
        p {
            font-size: 1.5rem;
            text-align: center;
            margin: 20px 0;
            max-width: 600px;
            padding: 0 20px;
            opacity: 0.9;
            animation: fadeInUp 2s ease-out 1s both;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 0.9; transform: translateY(0); }
        }
        
        .davinci-motif {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        .davinci-motif:nth-child(2) {
            top: 60%;
            right: 10%;
            animation-direction: reverse;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="davinci-motif"></div>
    <div class="davinci-motif"></div>
    <h1>Bienvenue</h1>
    <p>Découvrez un univers inspiré de Léonard de Vinci, où l'art renaissance fusionne avec des couleurs psychédéliques pour une expérience immersive et créative.</p>
</body>
</html>
