# =============================================================================
# webserv_test.conf — Test Configuration for 42 Webserv  (v4)
# =============================================================================
#
# FIX IN v4:
#   POST always requires `upload_store` to be set. The server's ResponseBuilder
#   has two separate 405 gates:
#     Gate 1: checks your `methods` directive              (was passing ✓)
#     Gate 2: checks that upload_store != NULL for POST    (was failing ✗)
#   Added `upload_store` to every location that lists POST in its methods.
#
# ALL FIXES SO FAR:
#   v2 — added `root` at server level (parser requires it)
#   v3 — backed sub-location roots up one level (root appends full URI)
#   v4 — added upload_store to POST locations (POST gate 2 in ResponseBuilder)
#
# SETUP:
#   chmod +x setup_test_env.sh && ./setup_test_env.sh
#   ./webserv webserv_test.conf
#   python3 test_webserv.py -v
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# SERVER 1 — port 8080
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen                  8080;
    #host                    127.0.0.1;
    server_name             localhost;
    root                    ./www0/site1/public;
    index                   index.html;
    error_page              404 /errors/404.html;
    client_max_body_size    200;

    # GET /           → ./www0/site1/public/index.html       ✓
    # POST /          → stored in ./www0/site1/uploads        ✓
    # DELETE /        → 405 (not in methods)                ✓
    location / {
        root            ./www0/site1/public;
        index           index.html;
        methods         GET POST;
        upload_store    ./www0/site1/uploads;
    }

    # GET /uploads/x     → ./www0/site1/uploads/x            ✓
    # POST /uploads      → stored in ./www0/site1/uploads     ✓
    # DELETE /uploads/x  → allowed                          ✓
    location /uploads {
        root            ./www0/site1;
        methods         GET POST DELETE;
        upload_store    ./www0/site1/uploads;
    }

    # GET /readonly/file.txt → ./www0/site1/readonly/file.txt ✓
    # POST /readonly         → 405 (not in methods)          ✓
    # DELETE /readonly       → 405 (not in methods)          ✓
    location /readonly {
        root            ./www0/site1;
        methods         GET;
    }

    # Serves custom error pages (referenced by error_page directive above)
    location /errors {
        root            ./www0/site1;
        methods         GET;
    }

    # Redirect /redirect → / (browser redirect demo)
    location /redirect {
        return 301 http://127.0.0.1:8080/;
    }

    # Cookie demo — cookie.py sets/reads session_id cookie and saves theme server-side
    #location /cookie {
    #    root            ./www0;
    #    methods         GET POST;
    #    upload_store    ./www0/cookie;
    #    cgi_handler     .py /usr/bin/python3;
    #}

    # Login demo — login.py creates session, logout.py deletes it
    #location /login {
    #    root            ./www0;
    #    methods         GET POST;
    #    upload_store    ./www0/login;
    #    cgi_handler     .py /usr/bin/python3;
    #}

	# Cookies (theme clair/sombre) - CGI python
	location	/cookie
	{
		return	302	/cookie/cookie.py;
	}

	location	/cookie/cookie.py
	{
		root		www0;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	# Login / notes privees - CGI python
	location	/login
	{
		return	302	/login/login.py;
	}

	location	/login/login.py
	{
		root		www0;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	location	/login/logout.py
	{
		root		www0;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

    # GET  /cgi-bin/hello.py   → runs hello.py with python3
    # POST /cgi-bin/post.py    → runs post.py with python3, reads stdin
    # GET  /cgi-bin/hello.php  → runs hello.php with php
    # GET  /cgi-bin/hello.pl   → runs hello.pl with perl
    # GET  /cgi-bin/error.py   → python script that crashes (tests error handling)
    # GET  /cgi-bin/loop.py    → infinite loop (tests timeout handling)
    location /cgi-bin {
        root            ./www0/site1;
        methods         GET POST;
        cgi_handler     .py  /usr/bin/python3;
        cgi_handler     .php /usr/bin/php-cgi;
        cgi_handler     .pl  /usr/bin/perl;
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# SERVER 2 — port 8081
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen                  127.0.0.1:8081;
    #host                    127.0.0.1;
    server_name             localhost2;
    root                    ./www0/site2/html;
    index                   index.html;
    error_page              404 /404.html;

    # GET only — POST → 405, tested in TestAllowedMethods.test_server2_post_forbidden
    location / {
        root            ./www0/site2/html;
        index           index.html;
        methods         GET;
    }
}

