# Config finale pour tester le site www/main
server
{
	listen					8080;
	server_name				localhost;

	root					www/main;
	index					index.html;
	client_max_body_size	20M;
	autoindex				off;

	# Pages d'erreur custom du site
	error_page 403 /customErrorPages/403.html;
	error_page 404 /customErrorPages/404.html;

	# Toutes les pages statiques (index, GET/POST/upload/delete html, css, images...)
	location	/
	{
		methods		GET POST DELETE;
		index		index.html;
	}

	# Scripts CGI (python, bash, php)
	# NB: pas de "root" ici -> root du server (www/main) est utilisé,
	# et le path complet "/cgi-bin/xxx.py" est concatene au root, ce qui donne
	# bien "www/main/cgi-bin/xxx.py". Mettre un root ici dupliquerait
	# le segment "cgi-bin" dans le chemin final.
	location	/cgi-bin
	{
		methods		GET POST DELETE;

		cgi_handler	.py		/usr/bin/python3;
		cgi_handler	.sh		/bin/bash;
		cgi_handler	.php	/usr/bin/php;
	}

	# Dossier d'upload utilisé par upload.py / delete_resource.py / download.py
	location	/cgi-bin/uploads
	{
		methods					GET POST DELETE;
		upload_store			www/main/cgi-bin/uploads;
		client_max_body_size	20M;
		autoindex				on;
	}

	# ================= PARTIE BONUS (liens de index.html) =================
	# Toutes les sections bonus vivent a plat dans www/<section>/, donc on
	# utilise root www; pour que root+path = www/<section>/... (cf NB plus haut)

	# Portfolios statiques
	# NB: redirection vers le chemin avec "/" final, sinon la resolution
	# de l'index ne trouve pas le fichier (chemin sans slash + index colle).
	location	/xmesky
	{
		return	302	/xmesky/;
	}

	location	/xmesky/
	{
		root	www;
		methods	GET;
		index	xmesky.html;
	}

	location	/juiceee
	{
		return	302	/juiceee/;
	}

	location	/juiceee/
	{
		root	www;
		methods	GET;
		index	index.html;
	}

	location	/toukoum
	{
		return	302	/toukoum/;
	}

	location	/toukoum/
	{
		root	www;
		methods	GET;
		index	toukoum.html;
	}

	# Listing de fichiers (autoindex) -> www/list
	location	/list
	{
		root		www;
		methods		GET;
		autoindex	on;
	}

	# Redirection externe 301
	location	/youtube
	{
		return	301	https://www.youtube.com;
	}

	# "Alias" -> redirige vers banane.html dans www/banane
	location	/alias
	{
		return	302	/banane/banane.html;
	}

	location	/banane
	{
		root	www;
		methods	GET;
		index	banane.html;
	}

	# Cookies (theme clair/sombre) - CGI python
	location	/cookie
	{
		return	302	/cookie/cookie.py;
	}

	location	/cookie/cookie.py
	{
		root		www;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	# Login / notes privees - CGI python
	location	/login
	{
		return	302	/login/login.py;
	}

	location	/login/login.py
	{
		root		www;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	location	/login/logout.py
	{
		root		www;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	# Recuperation des fichiers uploades (cgi-bin/uploads) - CGI python
	location	/download
	{
		return	302	/download/download.py;
	}

	location	/download/download.py
	{
		root		www;
		methods		GET;
		cgi_handler	.py	/usr/bin/python3;
	}

	# Upload/download/delete natifs (sans CGI)
	location	/filetransfert
	{
		return	302	/filetransfert/index.py;
	}

	location	/filetransfert/index.py
	{
		root		www;
		methods		GET;
		cgi_handler	.py	/usr/bin/python3;
	}

	location	/filetransfert/index2.py
	{
		root		www;
		methods		GET POST;
		cgi_handler	.py	/usr/bin/python3;
	}

	location	/filetransfert/uploads
	{
		root					www;
		methods					GET POST DELETE;
		upload_store			www/filetransfert/uploads;
		client_max_body_size	20M;
		autoindex				on;
	}
}

